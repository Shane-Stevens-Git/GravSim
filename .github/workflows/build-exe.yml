# Builds GravSim.exe on a Windows runner.
# - Every push to main and every manual run: the .exe is attached to the run as an artifact
#   (Actions tab -> the run -> Artifacts -> GravSim-windows).
# - Pushing a tag like v1.0: the .exe is also attached to a GitHub Release for that tag.
name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GravSim main.py

      - name: Smoke test (import everything the exe needs)
        run: python -c "import app, physics, scenes, craft, settings; print('ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: GravSim-windows
          path: dist/GravSim.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GravSim.exe
